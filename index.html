    <h1>登入到 Spotify</h1>

    <div class="login-options">
        <button class="login-button">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="#4285F4">
                <path d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12c0-4.1 3.2-7.27 7.2-7.27 3.09 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.1 2C6.42 2 2.03 6.8 2.03 12c0 5.05 4.13 10 10.22 10 5.35 0 9.25-3.67 9.25-9.09 0-1.15-.15-1.81-.15-1.81z"/>
            </svg>
            以 Google 帳戶繼續
        </button>

        <button class="login-button">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="#3b5998">
                <path d="M22.675 0h-21.35c-.732 0-1.325.593-1.325 1.325v21.351c0 .731.593 1.324 1.325 1.324h11.495v-9.294h-3.128v-3.622h3.128v-2.671c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12v9.293h6.116c.73 0 1.323-.593 1.323-1.325v-21.35c0-.732-.593-1.325-1.325-1.325z"/>
            </svg>
            使用 Facebook 帳戶繼續
        </button>

        <button class="login-button">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="white">
                <path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zm3.556-3.635c.831-1.014 1.39-2.427 1.234-3.831-1.193.052-2.636.805-3.494 1.818-.767.896-1.438 2.33-1.26 3.7 1.338.104 2.698-.688 3.52-1.687z"/>
            </svg>
            使用 Apple 帳戶繼續
        </button>
    </div>

    <div class="divider">或</div>

    <form id="loginForm">
        <div class="form-group">
            <label for="email">電子信箱或使用者名稱</label>
            <input type="text" id="email" placeholder="電子信箱或使用者名稱" required>
        </div>

        <div class="form-group">
            <label for="password">密碼</label>
            <div class="password-container">
                <input type="password" id="password" placeholder="密碼" required>
                <div class="show-password" id="togglePassword">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </div>
            </div>
        </div>

        <button type="submit" class="submit-button">登入</button>
    </form>

    <div class="forgot-password">
        <a href="#">忘記密碼？</a>
    </div>

    <div class="signup-link">
        <span>未註冊帳戶？</span> <a href="#">註冊 Spotify</a>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
