<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入到 Spotify</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="login-container">
    <div class="spotify-logo">
        <svg viewBox="0 0 167 167" fill="white">
            <path d="M83.5 0C37.3 0 0 37.3 0 83.5S37.3 167 83.5 167 167 129.7 167 83.5 129.7 0 83.5 0zm38.2 120.5c-1.5 2.5-4.7 3.2-7.2 1.7-19.7-12-44.4-14.7-73.6-8-2.8.5-5.6-1.2-6.2-4.1-.5-2.8 1.3-5.6 4.1-6.2 31.9-7.3 59.3-4.2 81.3 9.3 2.5 1.5 3.4 4.7 1.6 7.3zm10.1-22.3c-1.9 3.1-5.9 4-9 2.2-22.5-13.8-56.8-17.8-83.4-9.8-3.5 1-7.1-1-8.1-4.5-1-3.5 1-7.1 4.5-8.1 30.4-9.2 68.2-4.8 94.1 11.1 3.1 1.9 4 6 2.9 9.1zm.9-23.2c-27-16-71.5-17.5-97.3-9.7-4.1 1.3-8.5-1.1-9.8-5.2-1.3-4.1 1.1-8.5 5.2-9.8 29.6-9 78.8-7.2 109.8 11.2 3.7 2.2 4.9 7 2.7 10.7-2.2 3.8-7 5-10.6 2.8z"/>
        </svg>
    </div>

    <h1>登入到 Spotify</h1>

    <div id="errorBanner" class="error-banner" style="display: none;">
        <div class="error-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        </div>
        <span id="errorMessage">請輸入您的電子郵件和密碼。</span>
    </div>

    <div class="login-options">
        <button class="login-button">
            <div class="icon google-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
            </div>
            以 Google 帳戶繼續
        </button>

        <button class="login-button">
            <div class="icon facebook-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                    <circle fill="#3F51B5" cx="24" cy="24" r="24"/>
                    <path fill="#FFFFFF" d="M29.9,19.5h-4v-2.6c0-1,0.7-1.2,1.1-1.2c0.5,0,2.8,0,2.8,0v-4.4l-3.9,0c-4.4,0-5.3,3.3-5.3,5.3v2.9h-2.5V24 h2.5c0,5.8,0,12.7,0,12.7h5.3c0,0,0-7,0-12.7h3.6L29.9,19.5z"/>
                </svg>
            </div>
            使用 Facebook 帳戶繼續
        </button>

        <button class="login-button">
            <div class="icon apple-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512">
                    <path fill="white" d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
                </svg>
            </div>
            使用 Apple 帳戶繼續
        </button>
    </div>

    <div class="divider">或</div>

    <form id="loginForm">
        <div class="form-group">
            <label for="email">電子信箱或使用者名稱</label>
            <input type="text" id="email" placeholder="電子信箱或使用者名稱" required>
        </div>

        <div class="form-group">
            <label for="password">密碼</label>
            <div class="password-container">
                <input type="password" id="password" placeholder="密碼" required>
                <div class="show-password" id="togglePassword">
                    <!-- 顯示/隱藏密碼的眼睛圖標 -->
                    <!-- 一般狀態下顯示的圖標（眼睛） -->
                    <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <!-- 密碼顯示時的圖標（眼睛上有斜線） -->
                    <svg id="eyeSlashIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </div>
            </div>
        </div>

        <button type="submit" class="submit-button">登入</button>
    </form>

    <div class="forgot-password">
        <a href="#">忘記密碼？</a>
    </div>

    <div class="signup-link">
        <span>未註冊帳戶？</span> <a href="#">註冊 Spotify</a>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
